# Deploy both approved and WordPress-derived previews to GitHub Pages
name: Deploy static previews to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build preview site
        run: |
          rm -rf _site
          mkdir -p _site/wp-preview _site/theme-preview
          cp -R theme-preview/. _site/.
          cp -R theme-preview/. _site/theme-preview/.
          cp -R wp-preview/. _site/wp-preview/.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
