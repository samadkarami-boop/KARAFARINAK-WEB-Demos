name: Deploy static previews to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "theme-preview/**"
      - "Site2/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # Existing approved static preview at site root
          cp -R theme-preview/. _site/.

          # Site2 preview at /Site2/Preview/
          mkdir -p _site/Site2/Preview
          rsync -a \
            --exclude='Preview/' \
            --exclude='SITE2_REPORT.md' \
            Site2/ _site/Site2/Preview/

          # Keep repository-only placeholder/report files out of the public preview
          rm -f _site/Site2/Preview/.gitkeep

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# Clean trigger for a fresh Pages deployment

